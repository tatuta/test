<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>文化祭 FPS風 ARシューティング</title>
    <!-- A-Frameの読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; user-select: none; }
        /* カメラ映像 */
        #webcam {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1;
        }
        /* プレイ中のUI（左上） */
        #ui {
            position: fixed; top: 10px; left: 10px; z-index: 10;
            color: white; font-family: sans-serif; font-size: 18px;
            background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px;
            pointer-events: none; /* UIがタップを邪魔しないように */
        }
        /* 画面中央の照準（レティクル） */
        #reticle {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30px; height: 30px;
            border: 4px solid white; border-radius: 50%;
            z-index: 15; pointer-events: none;
            opacity: 0.8;
        }
        #reticle::after { /* 照準の中心の点 */
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6px; height: 6px; background: white; border-radius: 50%;
        }
        /* 画面下の撃つボタン */
        #shoot-btn {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            width: 100px; height: 100px;
            z-index: 20; background: rgba(255, 0, 0, 0.7);
            color: white; border: 5px solid white; border-radius: 50%;
            font-size: 24px; font-weight: bold; font-family: sans-serif;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            outline: none; -webkit-tap-highlight-color: transparent;
        }
        #shoot-btn:active { transform: translateX(-50%) scale(0.92); background: rgba(255, 0, 0, 0.9); }

        /* ゲーム終了画面 */
        #result-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30; background: rgba(0, 0, 0, 0.9);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: sans-serif;
        }
        #result-screen h2 { font-size: 32px; color: #ffeb3b; }
        #final-score { font-size: 60px; font-weight: bold; margin: 20px 0 40px 0; }
        #retry-btn {
            padding: 15px 40px; font-size: 20px; font-weight: bold;
            background-color: #ff5722; color: white; border: none; border-radius: 30px;
        }
    </style>
</head>
<body>
    <!-- カメラ映像 -->
    <video id="webcam" autoplay playsinline></video>

    <!-- 照準 -->
    <div id="reticle"></div>

    <!-- 撃つボタン -->
    <button id="shoot-btn">撃つ</button>

    <!-- プレイ中のUI -->
    <div id="ui">
        <div>⏱️: <span id="timer">40</span> 秒</div>
        <div>🎯: <span id="score">0</span> 点</div>
    </div>

    <!-- ゲーム終了画面 -->
    <div id="result-screen">
        <h2>タイムアップ！</h2>
        <p>スコア</p>
        <div id="final-score">0 点</div>
        <button id="retry-btn">リトライ</button>
    </div>

    <!-- AR空間 -->
    <a-scene vr-mode-ui="enabled: false">
        <!-- 
            カメラの設定
            raycasterをカメラに付け、画面中央（照準）の先にある物体を検知できるようにします。
        -->
        <a-entity id="camera" camera look-controls raycaster="objects: .target; interval: 100"></a-entity>
        
        <!-- 敵の画像データ（assets）の定義。ここに自分たちのイラストのURLを貼ります -->
        <a-assets>
            <img id="enemy-img" src="https://picsum.photos/200">
        </a-assets>

        <!-- 
            敵はJavaScriptで動的に複数生成するため、ここには何も書きません。
            以前あった fixed-target は削除しました。
        -->
    </a-scene>

    <script>
        // カメラ起動
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { document.getElementById('webcam').srcObject = stream; })
            .catch(err => { alert("カメラの起動に失敗しました。"); });

        // --- 効果音の設定 ---
        // 無料のフリー音源URLを使用しています
        const sndShoot = new Audio('https://binb-web-ar.s3.ap-northeast-1.amazonaws.com/sound/shoot.mp3'); // 撃った音（空振り）
        const sndHit = new Audio('https://binb-web-ar.s3.ap-northeast-1.amazonaws.com/sound/hit.mp3');     // 当たった音（爆発）
        sndShoot.volume = 0.5; // 音量を半分に
        sndHit.volume = 0.7;

        // ゲームの変数
        let score = 0;
        let timeLeft = 30; // 制限時間
        let gameInterval;
        let isPlaying = false;
        const ENEMY_COUNT = 8; // ★同時に出現させる敵の数（スマホが重くなければ増やせます）

        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const resultScreen = document.getElementById('result-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const shootBtn = document.getElementById('shoot-btn');
        const retryBtn = document.getElementById('retry-btn');
        const scene = document.querySelector('a-scene');
        const raycasterEntity = document.getElementById('camera');

        // ゲーム開始
        function startGame() {
            score = 0;
            timeLeft = 30;
            isPlaying = true;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            resultScreen.style.display = 'none';
            
            removeOldEnemies(); // 古い敵を掃除
            createEnemies();    // 新しい敵をたくさん作る

            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        // ゲーム終了
        function endGame() {
            clearInterval(gameInterval);
            isPlaying = false;
            finalScoreDisplay.textContent = score + " 点";
            resultScreen.style.display = 'flex';
            removeOldEnemies(); // 敵を全員消す
        }

        // --- 敵を複数生成する関数 ---
        function createEnemies() {
            for (let i = 0; i < ENEMY_COUNT; i++) {
                const enemy = document.createElement('a-image');
                enemy.setAttribute('src', '#enemy-img'); // a-assetsで定義した画像をセット
                enemy.setAttribute('class', 'target');  <!-- raycasterが検知できるようにクラスを付ける -->
                enemy.setAttribute('width', '0.8');    <!-- 敵のサイズ -->
                enemy.setAttribute('height', '0.8');
                
                // ランダムな位置に配置する（360度）
                setRandomPosition(enemy);
                
                scene.appendChild(enemy);
            }
        }

        // 敵の位置をランダムに変える関数
        function setRandomPosition(entity) {
            const theta = Math.random() * Math.PI * 2;
            const phi = (Math.random() - 0.5) * Math.PI / 2.5; // 上下角度を少し狭く
            const radius = 3 + Math.random() * 2; // 距離を3〜5メートルの間でランダムに

            const x = radius * Math.cos(phi) * Math.sin(theta);
            const y = radius * Math.sin(phi);
            const z = -radius * Math.cos(phi) * Math.cos(theta);
            entity.setAttribute('position', `${x} ${y} ${z}`);
        }

        // 古い敵を削除する関数
        function removeOldEnemies() {
            const enemies = document.querySelectorAll('.target');
            enemies.forEach(e => e.parentNode.removeChild(e));
        }

        // --- 「撃つ」ボタンが押されたときの処理（心臓部） ---
        shootBtn.addEventListener('click', () => {
            if (!isPlaying) return;

            // ★まずは「撃った音」を鳴らす（臨場感！）
            sndShoot.currentTime = 0; // 音を最初に戻す（連打対応）
            sndShoot.play();

            // A-Frameのraycasterを使って、照準の先に何があるかチェック
            const raycaster = raycasterEntity.components.raycaster;
            const intersections = raycaster.intersectedEls; // 照準が捉えている物体のリスト

            if (intersections.length > 0) {
                const hitTarget = intersections[0]; // 一番手前にある物体

                // もしそれが「敵（.target クラス）」だったら
                if (hitTarget.classList.contains('target')) {
                    // ★「当たった音」を鳴らす（臨場感！）
                    sndHit.currentTime = 0;
                    sndHit.play();

                    score += 10; // 点数プラス
                    scoreDisplay.textContent = score;

                    // 当たった敵を一旦消して、1秒後に別の場所に再出現させる
                    hitTarget.setAttribute('visible', 'false');
                    setTimeout(() => {
                        if(isPlaying) { // ゲーム中なら
                            setRandomPosition(hitTarget);
                            hitTarget.setAttribute('visible', 'true');
                        }
                    }, 1000);
                }
            }
        });

        // リトライボタン
        retryBtn.addEventListener('click', startGame);

        // ページを開いたら開始
        startGame();
    </script>
</body>
</html>
