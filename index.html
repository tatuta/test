<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>文化祭 ARシューティングゲーム</title>
    <!-- A-Frame（3D空間を作るためのライブラリ）の読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        /* スマホのカメラ映像を全画面で一番後ろに表示 */
        #webcam {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1;
        }
        /* 画面上のスコア表示の見た目 */
        #ui {
            position: fixed; top: 10px; left: 10px; z-index: 10;
            color: white; font-family: sans-serif; font-size: 24px;
            background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 8px;
        }
    </style>
</head>
<body>
    <!-- カメラ映像を映すためのビデオタグ -->
    <video id="webcam" autoplay playsinline></video>

    <!-- 画面に表示するスコア -->
    <div id="ui">スコア: <span id="score">0</span> 点</div>

    <!-- ARの3D空間（背景は透明にしてカメラを透かす） -->
    <a-scene vr-mode-ui="enabled: false">
        <!-- スマホを動かしたときに周りを見回せるカメラの設定（タップできるようにマウスカーソルも連動） -->
        <a-entity camera look-controls raycaster="objects: .target" cursor="rayOrigin: mouse">
        </a-entity>

        <!-- 的（ターゲット）となる画像。最初は目の前（正面3メートル先）に配置 -->
        <!-- 「src」の部分を、自分たちが作ったイラストのURLに書き換えます -->
        <a-image id="enemy" class="target" src="https://picsum.photos/200" position="0 0 -3" width="1" height="1"></a-image>
    </a-scene>

    <script>
        // スマホの背面カメラを起動する処理
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                document.getElementById('webcam').srcObject = stream;
            })
            .catch(err => {
                alert("カメラの起動に失敗しました。ブラウザのカメラ許可を確認してください。");
            });

        let score = 0;
        const enemy = document.getElementById('enemy');
        const scoreDisplay = document.getElementById('score');

        // 的（ターゲット）をプレイヤーの周り（360度）にランダムに移動させる関数
        function respawnEnemy() {
            const theta = Math.random() * Math.PI * 2; // 0〜360度のランダムな方向
            const phi = (Math.random() - 0.5) * Math.PI / 3; // 上下のランダムな角度
            const radius = 3; // プレイヤーからの距離（3メートル）

            // 3次元の座標に変換
            const x = radius * Math.cos(phi) * Math.sin(theta);
            const y = radius * Math.sin(phi);
            const z = -radius * Math.cos(phi) * Math.cos(theta);

            enemy.setAttribute('position', `${x} ${y} ${z}`);
        }

        // 的がタップされたときの処理
        enemy.addEventListener('click', () => {
            score += 10; // 10点プラス
            scoreDisplay.textContent = score; // 画面のスコアを更新
            respawnEnemy(); // 的を次のランダムな場所に移動
        });

        // 最初の一回目の配置
        respawnEnemy();
    </script>
</body>
</html>
