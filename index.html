<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- 連打ズームを禁止するための設定を追加 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文化祭 FPS風 ARシューティング</title>
    <!-- A-Frameの読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; user-select: none; touch-action: none; }
        /* カメラ映像 */
        #webcam {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1;
        }
        /* プレイ中のUI（左上） */
        #ui {
            position: fixed; top: 10px; left: 10px; z-index: 10;
            color: white; font-family: sans-serif; font-size: 18px;
            background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px;
            pointer-events: none;
        }
        /* 画面中央の照準（レティクル） */
        #reticle {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30px; height: 30px;
            border: 4px solid white; border-radius: 50%;
            z-index: 15; pointer-events: none;
            opacity: 0.8;
        }
        #reticle::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6px; height: 6px; background: white; border-radius: 50%;
        }

        /* ★弾の発射エフェクト（マズルフラッシュ） */
        #flash-effect {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 120px; height: 120px;
            border: 8px solid #ffeb3b; border-radius: 50%;
            background: rgba(255, 235, 59, 0.2);
            z-index: 14; pointer-events: none;
            opacity: 0;
        }
        /* 連打したときにアニメーションを何度も実行させるためのクラス */
        .flash-animation {
            animation: flash 0.12s ease-out;
        }
        @keyframes flash {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; border-width: 10px; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; border-width: 1px; }
        }

        /* 画面下の撃つボタン */
        #shoot-btn {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            width: 110px; height: 110px;
            z-index: 20; background: rgba(255, 0, 0, 0.75);
            color: white; border: 5px solid white; border-radius: 50%;
            font-size: 24px; font-weight: bold; font-family: sans-serif;
            cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            outline: none; -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #shoot-btn:active { transform: translateX(-50%) scale(0.90); background: rgba(255, 0, 0, 0.95); }

        /* ゲーム終了画面 */
        #result-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30; background: rgba(0, 0, 0, 0.9);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: sans-serif;
        }
        #result-screen h2 { font-size: 32px; color: #ffeb3b; }
        #final-score { font-size: 60px; font-weight: bold; margin: 20px 0 40px 0; }
        #retry-btn {
            padding: 15px 40px; font-size: 20px; font-weight: bold;
            background-color: #ff5722; color: white; border: none; border-radius: 30px;
        }
    </style>
</head>
<body>
    <!-- カメラ映像 -->
    <video id="webcam" autoplay playsinline></video>

    <!-- 照準と発射エフェクト -->
    <div id="reticle"></div>
    <div id="flash-effect"></div>

    <!-- 撃つボタン -->
    <button id="shoot-btn">撃つ</button>

    <!-- プレイ中のUI -->
    <div id="ui">
        <div>⏱️: <span id="timer">15</span> 秒</div>
        <div>🎯: <span id="score">0</span> 点</div>
    </div>

    <!-- ゲーム終了画面 -->
    <div id="result-screen">
        <h2>タイムアップ！</h2>
        <p>スコア</p>
        <div id="final-score">0 点</div>
        <button id="retry-btn">リトライ</button>
    </div>

    <!-- AR空間 -->
    <a-scene vr-mode-ui="enabled: false">
        <a-entity id="camera" camera look-controls raycaster="objects: .target; interval: 100"></a-entity>
        
        <!-- 敵の画像データ -->
        <a-assets>
            <img id="enemy-img" src="https://picsum.photos/200">
        </a-assets>
    </a-scene>

    <script>
        // カメラ起動
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { document.getElementById('webcam').srcObject = stream; })
            .catch(err => { alert("カメラの起動に失敗しました。"); });

        // ★ブラウザ内部で「音」をその場で合成して鳴らすシステム（Web Audio API）
        // これにより、外部の音源ファイルがなくても確実に音が鳴ります
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        // 撃ったときの音（レーザー音）
        function playShootSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sawtooth'; // ギザギザしたかっこいい電子音
            osc.frequency.setValueAtTime(900, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1); // 音程を急激に下げる
            
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); // 音量
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // 的に当たったときの音（爆発音）
        function playHitSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle'; // 太い音
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.2);
            
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // ゲームの変数
        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let isPlaying = false;
        const ENEMY_COUNT = 8; // 同時に出現させる敵の数

        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const resultScreen = document.getElementById('result-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const shootBtn = document.getElementById('shoot-btn');
        const retryBtn = document.getElementById('retry-btn');
        const scene = document.querySelector('a-scene');
        const raycasterEntity = document.getElementById('camera');
        const flashEffect = document.getElementById('flash-effect');

        // ゲーム開始
        function startGame() {
            score = 0;
            timeLeft = 30;
            isPlaying = true;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            resultScreen.style.display = 'none';
            
            removeOldEnemies();
            createEnemies();

            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        // ゲーム終了
        function endGame() {
            clearInterval(gameInterval);
            isPlaying = false;
            finalScoreDisplay.textContent = score + " 点";
            resultScreen.style.display = 'flex';
            removeOldEnemies();
        }

        // 敵を複数生成
        function createEnemies() {
            for (let i = 0; i < ENEMY_COUNT; i++) {
                const enemy = document.createElement('a-image');
                enemy.setAttribute('src', '#enemy-img');
                enemy.setAttribute('class', 'target');
                enemy.setAttribute('width', '0.8');
                enemy.setAttribute('height', '0.8');
                setRandomPosition(enemy);
                scene.appendChild(enemy);
            }
        }

        // 敵の位置をランダムに配置
        function setRandomPosition(entity) {
            const theta = Math.random() * Math.PI * 2;
            const phi = (Math.random() - 0.5) * Math.PI / 2.5;
            const radius = 3 + Math.random() * 2;

            const x = radius * Math.cos(phi) * Math.sin(theta);
            const y = radius * Math.sin(phi);
            const z = -radius * Math.cos(phi) * Math.cos(theta);
            entity.setAttribute('position', `${x} ${y} ${z}`);
        }

        // 古い敵を削除
        function removeOldEnemies() {
            const enemies = document.querySelectorAll('.target');
            enemies.forEach(e => e.parentNode.removeChild(e));
        }

        // ★「撃つ」処理を関数として独立（連打・ズーム防止対応）
        function fireWeapon(e) {
            if (e) e.preventDefault(); // ★スマホのダブルタップズームや選択を完全にブロック
            if (!isPlaying) return;

            // 1. 発射エフェクト（マズルフラッシュ）を発動
            flashEffect.classList.remove('flash-animation');
            void flashEffect.offsetWidth; // クラスを即時再読み込みさせる魔法のコード
            flashEffect.classList.add('flash-animation');

            // 2. 撃った音を鳴らす（確実に鳴る！）
            playShootSound();

            // 3. 当たり判定
            const raycaster = raycasterEntity.components.raycaster;
            const intersections = raycaster.intersectedEls;

            if (intersections.length > 0) {
                const hitTarget = intersections[0];

                if (hitTarget.classList.contains('target')) {
                    // 当たった音を鳴らす
                    playHitSound();

                    score += 10;
                    scoreDisplay.textContent = score;

                    hitTarget.setAttribute('visible', 'false');
                    setTimeout(() => {
                        if(isPlaying) {
                            setRandomPosition(hitTarget);
                            hitTarget.setAttribute('visible', 'true');
                        }
                    }, 800);
                }
            }
        }

        // ★スマホのタッチ（touchstart）とPCのクリック（mousedown）の両方で即座に発動するように設定
        shootBtn.addEventListener('touchstart', fireWeapon, { passive: false });
        shootBtn.addEventListener('mousedown', fireWeapon);

        // リトライボタン
        retryBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); });
        retryBtn.addEventListener('click', startGame);

        // ページを開いたら開始
        startGame();
    </script>
</body>
</html>
