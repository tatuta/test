<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>文化祭 ARシューティングゲーム</title>
    <!-- A-Frameの読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        /* カメラ映像 */
        #webcam {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1;
        }
        /* プレイ中のUI（左上に表示） */
        #ui {
            position: fixed; top: 10px; left: 10px; z-index: 10;
            color: white; font-family: sans-serif; font-size: 20px;
            background: rgba(0,0,0,0.6); padding: 12px 20px; border-radius: 8px;
            line-height: 1.5;
        }
        /* ゲーム終了画面（画面全体を覆う暗幕） */
        #result-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20; background: rgba(0, 0, 0, 0.85);
            display: none; /* 最初は非表示、終了時に flex に切り替える */
            flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: sans-serif;
        }
        #result-screen h2 { font-size: 36px; color: #ffeb3b; margin-bottom: 5px; }
        #result-screen p { font-size: 18px; margin: 10px 0 0 0; color: #ccc; }
        #final-score { font-size: 54px; font-weight: bold; color: white; margin: 15px 0 30px 0; }
        /* もう一度遊ぶボタン */
        #retry-btn {
            padding: 14px 40px; font-size: 20px; font-weight: bold;
            background-color: #ff5722; color: white; border: none; border-radius: 30px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        #retry-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <!-- カメラ映像用 -->
    <video id="webcam" autoplay playsinline></video>

    <!-- プレイ中のタイムとスコア -->
    <div id="ui">
        <div>⏱️ タイム: <span id="timer">30</span> 秒</div>
        <div>🎯 スコア: <span id="score">0</span> 点</div>
    </div>

    <!-- ゲーム終了画面（リザルト画面） -->
    <div id="result-screen">
        <h2>タイムアップ！</h2>
        <p>あなたの得点は…</p>
        <div id="final-score">0 点</div>
        <button id="retry-btn">もう一度遊ぶ</button>
    </div>

    <!-- AR空間 -->
    <a-scene vr-mode-ui="enabled: false">
        <a-entity camera look-controls raycaster="objects: .target" cursor="rayOrigin: mouse"></a-entity>
        <!-- 的（ターゲット） -->
        <a-image id="enemy" class="target" src="https://picsum.photos/200" position="0 0 -3" width="1" height="1"></a-image>
    </a-scene>

    <script>
        // カメラ起動処理
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { document.getElementById('webcam').srcObject = stream; })
            .catch(err => { alert("カメラの起動に失敗しました。"); });

        // ゲームの変数の設定
        let score = 0;
        let timeLeft = 30; // ★ここで制限時間を変更できます（例: 30秒）
        let gameInterval;
        let isPlaying = false;

        const enemy = document.getElementById('enemy');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const resultScreen = document.getElementById('result-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const retryBtn = document.getElementById('retry-btn');

        // ゲーム開始・リセットの関数
        function startGame() {
            score = 0;
            timeLeft = 30; // 制限時間をリセット
            isPlaying = true;
            
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            resultScreen.style.display = 'none'; // 終了画面を隠す
            enemy.setAttribute('visible', 'true'); // 的を表示する
            
            respawnEnemy();

            // 1秒ごとにカウントダウンするタイマー
            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // ゲーム終了の関数
        function endGame() {
            clearInterval(gameInterval); // タイマーを止める
            isPlaying = false;
            enemy.setAttribute('visible', 'false'); // 的を非表示にしてタップできなくする
            
            finalScoreDisplay.textContent = score + " 点"; // 最終スコアをセット
            resultScreen.style.display = 'flex'; // 終了画面を表示
        }

        // 的をランダムな位置に移動させる関数
        function respawnEnemy() {
            const theta = Math.random() * Math.PI * 2;
            const phi = (Math.random() - 0.5) * Math.PI / 3;
            const radius = 3;

            const x = radius * Math.cos(phi) * Math.sin(theta);
            const y = radius * Math.sin(phi);
            const z = -radius * Math.cos(phi) * Math.cos(theta);

            enemy.setAttribute('position', `${x} ${y} ${z}`);
        }

        // 的がタップされたときの処理
        enemy.addEventListener('click', () => {
            if (!isPlaying) return; // ゲーム中でなければ何もしない
            
            score += 10; // ★1回タップで入る点数
            scoreDisplay.textContent = score;
            respawnEnemy();
        });

        // 「もう一度遊ぶ」ボタンを押したとき
        retryBtn.addEventListener('click', () => {
            startGame();
        });

        // ページを開いたときに自動でゲーム開始
        startGame();
    </script>
</body>
</html>
