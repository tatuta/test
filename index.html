/* ver1*/
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文化祭 ARシューティング決定版</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; user-select: none; touch-action: none; 
            background-color: #000;
        }

        /* 縦横どんな画面でも要素を絶対に逃がさない箱 */
        .game-container {
            position: relative; width: 100%; height: 100%; overflow: hidden;
        }

        /* カメラ映像（最背面） */
        #webcam {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        /* AR空間 */
        a-scene {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }

        /* 画面中央の照準 */
        #reticle {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30px; height: 30px;
            border: 4px solid white; border-radius: 50%;
            z-index: 10; pointer-events: none; opacity: 0.8;
        }
        #reticle::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6px; height: 6px; background: white; border-radius: 50%;
        }

        /* 弾の発射エフェクト */
        #flash-effect {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 120px; height: 120px;
            border: 8px solid #ffeb3b; border-radius: 50%;
            background: rgba(255, 235, 59, 0.2);
            z-index: 9; pointer-events: none; opacity: 0;
        }
        .flash-animation { animation: flash 0.12s ease-out; }
        @keyframes flash {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; border-width: 10px; }
            100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; border-width: 1px; }
        }

        /* ★新機能：得点ポップアップ演出 */
        #score-popup {
            position: absolute; top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffeb3b; font-family: sans-serif; font-size: 28px; font-weight: bold;
            text-shadow: 0 0 8px rgba(0,0,0,1); z-index: 11; pointer-events: none; opacity: 0;
        }
        .popup-animation { animation: popup 0.4s ease-out; }
        @keyframes popup {
            0% { transform: translate(-50%, -30%) scale(0.5); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(1.0); opacity: 0; }
        }

        /* タイマーとスコアのUI（縦横どこでも左上に絶対固定） */
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 20;
            color: #ffffff; font-family: sans-serif; font-size: 18px; font-weight: bold;
            background: rgba(0, 0, 0, 0.7); padding: 10px 15px; border-radius: 8px;
            pointer-events: none; border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* 撃つボタン（縦横どこでも下中央に絶対固定） */
        #shoot-btn {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%);
            width: 100px; height: 100px;
            z-index: 25; background: rgba(255, 0, 0, 0.85);
            color: white; border: 4px solid white; border-radius: 50%;
            font-size: 22px; font-weight: bold; font-family: sans-serif;
            cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            outline: none; -webkit-tap-highlight-color: transparent;
        }
        #shoot-btn:active { transform: translateX(-50%) scale(0.90); background: rgba(255, 0, 0, 0.95); }

        /* ゲーム終了画面 */
        #result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30; background: rgba(0, 0, 0, 0.9);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: sans-serif;
        }
        #result-screen h2 { font-size: 32px; color: #ffeb3b; margin: 0; }
        #final-score { font-size: 60px; font-weight: bold; margin: 20px 0 40px 0; }
        #retry-btn {
            padding: 15px 40px; font-size: 20px; font-weight: bold;
            background-color: #ff5722; color: white; border: none; border-radius: 30px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <video id="webcam" autoplay playsinline></video>

        <div id="ui">
            <div>⏱️: <span id="timer">30</span> 秒</div>
            <div>🎯: <span id="score">0</span> 点</div>
        </div>

        <div id="reticle"></div>
        <div id="flash-effect"></div>
        <div id="score-popup"></div> <button id="shoot-btn">撃つ</button>

        <div id="result-screen">
            <h2>タイムアップ！</h2>
            <p>スコア</p>
            <div id="final-score">0 点</div>
            <button id="retry-btn">リトライ</button>
        </div>

        <a-scene embedded vr-mode-ui="enabled: false">
            <a-entity id="camera" camera look-controls="magicWindowTrackingEnabled: false" raycaster="objects: .target; interval: 100"></a-entity>
            
            <a-assets>
                <img id="enemy-img-1" src="enemy1.png">
                <img id="enemy-img-2" src="enemy2.png">
                <img id="enemy-img-3" src="enemy3.png">
                <img id="enemy-img-4" src="enemy4.png">
                <img id="enemy-img-5" src="enemy5.png">
                <img id="enemy-img-6" src="enemy6.png">
                <img id="enemy-img-7" src="enemy7.png">
                <img id="enemy-img-8" src="enemy8.png">
                <img id="enemy-img-9" src="enemy9.png">
                <img id="enemy-img-10" src="enemy10.png">
                <img id="enemy-img-11" src="enemy11.png">
                <img id="enemy-img-12" src="enemy12.png">
                <img id="enemy-img-13" src="enemy13.png">
                <img id="enemy-img-14" src="enemy14.png">
                <img id="enemy-img-15" src="enemy15.png">
                <img id="enemy-img-16" src="enemy16.png">
                <img id="enemy-img-17" src="enemy17.png">
                <img id="enemy-img-18" src="enemy18.png">
                <img id="enemy-img-19" src="enemy19.png">
                <img id="enemy-img-20" src="enemy20.png">
            </a-assets>
        </a-scene>
    </div>

    <script>
        // カメラ起動
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { document.getElementById('webcam').srcObject = stream; })
            .catch(err => { alert("カメラの起動に失敗しました。"); });

        // 音声合成システム
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }
        function playShootSound() {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(900, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
        function playHitSound() {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle'; osc.frequency.setValueAtTime(180, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        // ゲームの変数
        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let isPlaying = false;
        
        const ENEMY_COUNT = 8; 
        const TOTAL_CHARACTER_TYPES = 20; 

        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const resultScreen = document.getElementById('result-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const shootBtn = document.getElementById('shoot-btn');
        const retryBtn = document.getElementById('retry-btn');
        const scene = document.querySelector('a-scene');
        const raycasterEntity = document.getElementById('camera');
        const flashEffect = document.getElementById('flash-effect');
        const scorePopup = document.getElementById('score-popup');

        // 1〜20の画像番号を完全ランダムで選ぶ
        function getRandomEnemyNumber() {
            return Math.floor(Math.random() * TOTAL_CHARACTER_TYPES) + 1;
        }

        // ゲーム開始
        function startGame() {
            score = 0; timeLeft = 30; isPlaying = true;
            scoreDisplay.textContent = score; timerDisplay.textContent = timeLeft;
            resultScreen.style.display = 'none';
            removeOldEnemies();
            createEnemies();

            gameInterval = setInterval(() => {
                timeLeft--; timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        // ゲーム終了
        function endGame() {
            clearInterval(gameInterval); isPlaying = false;
            finalScoreDisplay.textContent = score + " 点";
            resultScreen.style.display = 'flex'; removeOldEnemies();
        }

        // 敵の生成
        function createEnemies() {
            for (let i = 0; i < ENEMY_COUNT; i++) {
                const enemy = document.createElement('a-image');
                const enemyNum = getRandomEnemyNumber();
                
                enemy.setAttribute('src', `#enemy-img-${enemyNum}`);
                enemy.setAttribute('class', 'target');
                // ★データ属性として、何番の画像かを敵自体に記憶させておく
                enemy.setAttribute('data-enemy-num', enemyNum);
                
                setRandomPositionAndSize(enemy);
                scene.appendChild(enemy);
            }
        }

        function setRandomPositionAndSize(entity) {
            const theta = Math.random() * Math.PI * 2;
            const phi = (Math.random() - 0.5) * Math.PI / 2.5;
            const radius = 2.5 + Math.random() * 3;
            const x = radius * Math.cos(phi) * Math.sin(theta);
            const y = radius * Math.sin(phi);
            const z = -radius * Math.cos(phi) * Math.cos(theta);
            entity.setAttribute('position', `${x} ${y} ${z}`);

            const randomScale = 0.7 + Math.random() * 0.3; 
            entity.setAttribute('width', randomScale);
            entity.setAttribute('height', randomScale);
        }

        function removeOldEnemies() {
            const enemies = document.querySelectorAll('.target');
            enemies.forEach(e => e.parentNode.removeChild(e));
        }

        // 「撃つ」処理
        function fireWeapon(e) {
            if (e) e.preventDefault();
            if (!isPlaying) return;

            flashEffect.classList.remove('flash-animation');
            void flashEffect.offsetWidth;
            flashEffect.classList.add('flash-animation');

            playShootSound();

            const raycaster = raycasterEntity.components.raycaster;
            const intersections = raycaster.intersectedEls;

            if (intersections.length > 0) {
                const hitTarget = intersections[0];

                if (hitTarget.classList.contains('target')) {
                    playHitSound();
                    
                    // ★新機能：撃った敵の番号を取得して、点数を計算する
                    const enemyNum = parseInt(hitTarget.getAttribute('data-enemy-num'), 10);
                    let pointEarned = 10; // 基本は10点

                    if (enemyNum >= 6 && enemyNum <= 15) {
                        pointEarned = 20; // 6〜15番は20点
                    } else if (enemyNum >= 16 && enemyNum <= 20) {
                        pointEarned = 50; // 16〜20番は50点🔥
                    }

                    // スコア更新
                    score += pointEarned;
                    scoreDisplay.textContent = score;

                    // ★新機能：画面に「+20!」などのポップアップを出す
                    scorePopup.textContent = `+${pointEarned}!`;
                    scorePopup.classList.remove('popup-animation');
                    void scorePopup.offsetWidth;
                    scorePopup.classList.add('popup-animation');

                    // 的を消す
                    hitTarget.setAttribute('visible', 'false');
                    
                    setTimeout(() => {
                        if(isPlaying) {
                            const newEnemyNum = getRandomEnemyNumber();
                            hitTarget.setAttribute('src', `#enemy-img-${newEnemyNum}`);
                            // 新しい敵の番号をデータ属性に上書き
                            hitTarget.setAttribute('data-enemy-num', newEnemyNum);
                            setRandomPositionAndSize(hitTarget);
                            hitTarget.setAttribute('visible', 'true');
                        }
                    }, 800);
                }
            }
        }

        // 常に正面を向かせるスクリプト
        scene.addEventListener('render-target-loaded', () => {
            scene.registerComponent('billboard', {
                tick: function () {
                    const cameraEl = document.getElementById('camera');
                    if (!cameraEl) return;
                    const targets = document.querySelectorAll('.target');
                    targets.forEach(target => {
                        target.object3D.lookAt(cameraEl.object3D.position);
                    });
                }
            });
            scene.setAttribute('billboard', '');
        });

        // タッチ操作設定
        shootBtn.addEventListener('touchstart', fireWeapon, { passive: false });
        shootBtn.addEventListener('mousedown', fireWeapon);
        retryBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); });
        retryBtn.addEventListener('click', startGame);

        startGame();
    </script>
</body>
</html>
