<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文化祭 FPS風 ARシューティング（20キャラ版）</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; user-select: none; touch-action: none; }
        /* カメラ映像 */
        #webcam {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1;
        }
        /* プレイ中のUI */
        #ui {
            position: fixed; top: 10px; left: 10px; z-index: 10;
            color: white; font-family: sans-serif; font-size: 18px;
            background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px;
            pointer-events: none;
        }
        /* 照準 */
        #reticle {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30px; height: 30px;
            border: 4px solid white; border-radius: 50%;
            z-index: 15; pointer-events: none;
            opacity: 0.8;
        }
        #reticle::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6px; height: 6px; background: white; border-radius: 50%;
        }
        /* 弾の発射エフェクト */
        #flash-effect {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 120px; height: 120px;
            border: 8px solid #ffeb3b; border-radius: 50%;
            background: rgba(255, 235, 59, 0.2);
            z-index: 14; pointer-events: none;
            opacity: 0;
        }
        .flash-animation {
            animation: flash 0.12s ease-out;
        }
        @keyframes flash {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; border-width: 10px; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; border-width: 1px; }
        }
        /* 撃つボタン */
        #shoot-btn {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            width: 110px; height: 110px;
            z-index: 20; background: rgba(255, 0, 0, 0.75);
            color: white; border: 5px solid white; border-radius: 50%;
            font-size: 24px; font-weight: bold; font-family: sans-serif;
            cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            outline: none; -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #shoot-btn:active { transform: translateX(-50%) scale(0.90); background: rgba(255, 0, 0, 0.95); }
        /* ゲーム終了画面 */
        #result-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30; background: rgba(0, 0, 0, 0.9);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: sans-serif;
        }
        #result-screen h2 { font-size: 32px; color: #ffeb3b; }
        #final-score { font-size: 60px; font-weight: bold; margin: 20px 0 40px 0; }
        #retry-btn {
            padding: 15px 40px; font-size: 20px; font-weight: bold;
            background-color: #ff5722; color: white; border: none; border-radius: 30px;
        }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline></video>
    <div id="reticle"></div>
    <div id="flash-effect"></div>
    <button id="shoot-btn">撃つ</button>
    <div id="ui">
        <div>⏱️: <span id="timer">30</span> 秒</div>
        <div>🎯: <span id="score">0</span> 点</div>
    </div>
    <div id="result-screen">
        <h2>タイムアップ！</h2>
        <p>スコア</p>
        <div id="final-score">0 点</div>
        <button id="retry-btn">リトライ</button>
    </div>

    <a-scene vr-mode-ui="enabled: false">
        <a-entity id="camera" camera look-controls raycaster="objects: .target; interval: 100"></a-entity>
        
        <a-assets>
            <img id="enemy-img-1" src="enemy1.png">
            <img id="enemy-img-2" src="enemy2.png">
            <img id="enemy-img-3" src="enemy3.png">
            <img id="enemy-img-4" src="enemy4.png">
            <img id="enemy-img-5" src="enemy5.png">
            <img id="enemy-img-6" src="enemy6.png">
            <img id="enemy-img-7" src="enemy7.png">
            <img id="enemy-img-8" src="enemy8.png">
            <img id="enemy-img-9" src="enemy9.png">
            <img id="enemy-img-10" src="enemy10.png">
            <img id="enemy-img-11" src="enemy11.png">
            <img id="enemy-img-12" src="enemy12.png">
            <img id="enemy-img-13" src="enemy13.png">
            <img id="enemy-img-14" src="enemy14.png">
            <img id="enemy-img-15" src="enemy15.png">
            <img id="enemy-img-16" src="enemy16.png">
            <img id="enemy-img-17" src="enemy17.png">
            <img id="enemy-img-18" src="enemy18.png">
            <img id="enemy-img-19" src="enemy19.png">
            <img id="enemy-img-20" src="enemy20.png">
        </a-assets>
    </a-scene>

    <script>
        // カメラ起動
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { document.getElementById('webcam').srcObject = stream; })
            .catch(err => { alert("カメラの起動に失敗しました。"); });

        // 音声合成システム（確実に鳴るシステム）
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }
        function playShootSound() {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(900, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
        function playHitSound() {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle'; osc.frequency.setValueAtTime(180, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        // ゲームの変数
        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let isPlaying = false;
        
        const ENEMY_COUNT = 8; // 同時に空間に出現させる数（20種類の中からランダムに8枚が選ばれます）
        const TOTAL_CHARACTER_TYPES = 20; // ★敵キャラクターの種類の総数

        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const resultScreen = document.getElementById('result-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const shootBtn = document.getElementById('shoot-btn');
        const retryBtn = document.getElementById('retry-btn');
        const scene = document.querySelector('a-scene');
        const raycasterEntity = document.getElementById('camera');
        const flashEffect = document.getElementById('flash-effect');

        // ★新機能：1〜20の中からランダムな画像ID（#enemy-img-X）を返す関数
        function getRandomEnemyId() {
            const randomNum = Math.floor(Math.random() * TOTAL_CHARACTER_TYPES) + 1; // 1〜20の整数
            return `#enemy-img-${randomNum}`;
        }

        // ゲーム開始
        function startGame() {
            score = 0; timeLeft = 30; isPlaying = true;
            scoreDisplay.textContent = score; timerDisplay.textContent = timeLeft;
            resultScreen.style.display = 'none';
            removeOldEnemies();
            createEnemies(); // 敵を作る（ここがランダム化されます）

            gameInterval = setInterval(() => {
                timeLeft--; timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        // ゲーム終了
        function endGame() {
            clearInterval(gameInterval); isPlaying = false;
            finalScoreDisplay.textContent = score + " 点";
            resultScreen.style.display = 'flex'; removeOldEnemies();
        }

        // ★変更点：敵を生成するときに画像をランダムにする
        function createEnemies() {
            for (let i = 0; i < ENEMY_COUNT; i++) {
                const enemy = document.createElement('a-image');
                
                // ★src属性に、ランダムな画像ID（#enemy-img-1〜20）をセットする
                enemy.setAttribute('src', getRandomEnemyId());
                
                enemy.setAttribute('class', 'target');
                enemy.setAttribute('width', '0.8'); enemy.setAttribute('height', '0.8');
                setRandomPosition(enemy);
                scene.appendChild(enemy);
            }
        }

        // 敵の位置をランダムに配置
        function setRandomPosition(entity) {
            const theta = Math.random() * Math.PI * 2;
            const phi = (Math.random() - 0.5) * Math.PI / 2.5;
            const radius = 3 + Math.random() * 2;
            const x = radius * Math.cos(phi) * Math.sin(theta);
            const y = radius * Math.sin(phi);
            const z = -radius * Math.cos(phi) * Math.cos(theta);
            entity.setAttribute('position', `${x} ${y} ${z}`);
        }

        // 古い敵を削除
        function removeOldEnemies() {
            const enemies = document.querySelectorAll('.target');
            enemies.forEach(e => e.parentNode.removeChild(e));
        }

        // 「撃つ」処理
        function fireWeapon(e) {
            if (e) e.preventDefault();
            if (!isPlaying) return;

            flashEffect.classList.remove('flash-animation');
            void flashEffect.offsetWidth;
            flashEffect.classList.add('flash-animation');

            playShootSound();

            const raycaster = raycasterEntity.components.raycaster;
            const intersections = raycaster.intersectedEls;

            if (intersections.length > 0) {
                const hitTarget = intersections[0];

                if (hitTarget.classList.contains('target')) {
                    playHitSound();
                    score += 10;
                    scoreDisplay.textContent = score;

                    hitTarget.setAttribute('visible', 'false');
                    
                    // ★撃たれた敵が、次に再出現する前に画像を切り替える
                    setTimeout(() => {
                        if(isPlaying) {
                            // ★再出現する前に、src属性を新しいランダムな画像に書き換える
                            hitTarget.setAttribute('src', getRandomEnemyId());
                            setRandomPosition(hitTarget);
                            hitTarget.setAttribute('visible', 'true');
                        }
                    }, 800);
                }
            }
        }

        // 操作設定
        shootBtn.addEventListener('touchstart', fireWeapon, { passive: false });
        shootBtn.addEventListener('mousedown', fireWeapon);
        retryBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); });
        retryBtn.addEventListener('click', startGame);

        // 開始
        startGame();
    </script>
</body>
</html>
